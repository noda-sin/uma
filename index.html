<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏇 うまレース DX 3D</title>
<style>
  :root {
    --gold: #ffd54a;
    --silver: #c9d1d9;
    --bronze: #cd7f32;
    --bg-deep: #0f1924;
    --bg-mid: #1a2a3a;
    --accent: #ff6b35;
    --accent2: #4ecdc4;
    --text: #f0f4f8;
    --muted: #8aa0b4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Helvetica Neue", sans-serif;
    background: radial-gradient(ellipse at top, #1e3a5f 0%, var(--bg-deep) 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: rgba(0,0,0,0.4);
    border-bottom: 2px solid var(--accent);
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  header h1 {
    font-size: 1.4rem;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
    font-weight: 900;
  }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 0.95rem; }
  .hud .item { display: flex; flex-direction: column; align-items: flex-end; }
  .hud .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .hud .value { font-weight: bold; font-size: 1.1rem; color: var(--gold); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 12px;
    padding: 12px;
    min-height: 0;
  }

  .sidebar {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px;
    overflow-y: auto;
    backdrop-filter: blur(8px);
  }
  .sidebar h2 {
    font-size: 0.85rem;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(78,205,196,0.3);
    padding-bottom: 6px;
  }
  .horse-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .horse-card:hover { background: rgba(255,255,255,0.12); transform: translateX(2px); }
  .horse-card.selected {
    background: rgba(255,213,74,0.18);
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(255,213,74,0.3);
  }
  .horse-card .hc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .horse-card .num {
    display: inline-block;
    width: 22px; height: 22px;
    border-radius: 4px;
    font-weight: 900; font-size: 0.85rem;
    text-align: center; line-height: 22px;
    color: #000;
  }
  .horse-card .name { font-weight: bold; margin-left: 6px; }
  .horse-card .odds {
    font-family: "Courier New", monospace;
    font-weight: bold;
    color: var(--gold);
    font-size: 1rem;
  }
  .horse-card .style {
    font-size: 0.7rem;
    color: var(--muted);
    margin-left: 4px;
  }
  .stat-bar { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 0.7rem; }
  .stat-bar .stat-label { width: 36px; color: var(--muted); }
  .stat-bar .bar { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  .stat-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--gold)); border-radius: 2px; }

  .bet-panel {
    margin-top: 14px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 12px;
  }
  .bet-panel label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .bet-panel input[type="number"] {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--text);
    padding: 8px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
  }
  .chips { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
  .chip {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 6px 4px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: bold;
    transition: all 0.1s;
  }
  .chip:hover { background: var(--accent); border-color: var(--accent); }

  button.primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, #ff8c5a 100%);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    letter-spacing: 1px;
    transition: transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 12px rgba(255,107,53,0.3);
  }
  button.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255,107,53,0.5); }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .arena {
    background: #0a1018;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
  }
  #canvas { width: 100%; flex: 1; display: block; }

  /* cinematic vignette + letterbox feel */
  .arena::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 120px 20px rgba(0,0,0,0.55);
    border-radius: 12px;
  }

  .commentary {
    position: absolute;
    bottom: 10px; left: 10px; right: 10px;
    background: rgba(0,0,0,0.7);
    border-left: 3px solid var(--accent);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
    min-height: 36px;
    display: flex;
    align-items: center;
    transition: opacity 0.3s;
    z-index: 3;
  }
  .commentary.show { opacity: 1; }
  .commentary.hide { opacity: 0; }

  .position-board {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.65);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.8rem;
    min-width: 140px;
    backdrop-filter: blur(4px);
    z-index: 3;
  }
  .position-board .title { color: var(--accent2); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .position-board .row { display: flex; align-items: center; padding: 2px 0; gap: 6px; }
  .position-board .pos-num { width: 16px; height: 16px; border-radius: 3px; font-size: 0.7rem; line-height: 16px; text-align: center; color: #000; font-weight: 900; }

  .countdown {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 8rem;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255,213,74,0.7), 4px 4px 0 rgba(0,0,0,0.5);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 4;
  }
  .countdown.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

  .result-modal {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .result-modal.show { display: flex; }
  .result-card {
    background: linear-gradient(135deg, var(--bg-mid), var(--bg-deep));
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 28px 40px;
    min-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .result-card h2 {
    text-align: center;
    font-size: 2rem;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 16px;
  }
  .podium { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .podium .row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
  }
  .podium .row.gold { background: rgba(255,213,74,0.15); border: 1px solid var(--gold); }
  .podium .row.silver { background: rgba(201,209,217,0.1); }
  .podium .row.bronze { background: rgba(205,127,50,0.1); }
  .medal { font-size: 1.5rem; width: 32px; }
  .podium .nm { flex: 1; font-weight: bold; }
  .podium .tm { font-family: "Courier New", monospace; color: var(--muted); font-size: 0.85rem; }

  .payout {
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
    margin-bottom: 12px;
  }
  .payout .big { font-size: 1.8rem; font-weight: 900; }
  .payout .big.win { color: #4caf50; }
  .payout .big.lose { color: #e74c3c; }
  .payout .sm { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  .toggle-music {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .cam-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
  }

  .loading, .errbox {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: var(--muted); font-size: 0.95rem;
    z-index: 6; text-align: center; padding: 20px;
  }
  .errbox { color: #ff8c8c; display: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbar */
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>
  <header>
    <h1>🏇 うまレース DX 3D</h1>
    <div class="hud">
      <div class="item"><span class="label">第</span><span class="value" id="raceNum">1</span></div>
      <div class="item"><span class="label">距離</span><span class="value" id="distance">1600m</span></div>
      <div class="item"><span class="label">天候</span><span class="value" id="weather">☀️ 晴</span></div>
      <div class="item"><span class="label">所持金</span><span class="value" id="money">¥10,000</span></div>
      <button class="cam-btn" id="camBtn">🎥 自動</button>
      <button class="toggle-music" id="muteBtn">🔊 音 ON</button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <h2>出走表</h2>
      <div id="horseList"></div>

      <div class="bet-panel">
        <h2 style="margin-top:0">単勝予想</h2>
        <label>賭け金 (¥)</label>
        <input type="number" id="betAmount" value="500" min="100" step="100">
        <div class="chips">
          <button class="chip" data-amt="100">+100</button>
          <button class="chip" data-amt="500">+500</button>
          <button class="chip" data-amt="1000">+1k</button>
          <button class="chip" data-amt="5000">+5k</button>
        </div>
        <button class="primary" id="startBtn">スタート</button>
      </div>
    </aside>

    <div class="arena">
      <canvas id="canvas"></canvas>
      <div class="position-board" id="posBoard">
        <div class="title">順位</div>
        <div id="posRows"></div>
      </div>
      <div class="commentary hide" id="commentary">準備完了。馬を選んで賭けてください。</div>
      <div class="countdown" id="countdown"></div>
      <div class="loading" id="loading"><div class="spinner"></div><div>3Dコースを生成中…</div></div>
      <div class="errbox" id="errbox">⚠️ 3Dエンジン (three.js) の読み込みに失敗しました。<br>ネットワーク接続を確認して再読み込みしてください。</div>

      <div class="result-modal" id="resultModal">
        <div class="result-card">
          <h2 id="resultTitle">🏆 RESULT 🏆</h2>
          <div class="podium" id="podium"></div>
          <div class="payout" id="payoutBox"></div>
          <button class="primary" id="nextRaceBtn">次のレースへ</button>
        </div>
      </div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

// ============ Game State ============
const STATE = {
  money: 10000,
  raceNum: 1,
  selectedHorse: null,
  betAmount: 500,
  horses: [],
  running: false,
  raceDistance: 1600,
  weather: { name: "☀️ 晴", muddy: 0 },
  audioOn: true,
  audioCtx: null,
  autoCam: true,
};

const HORSE_POOL = [
  { name: "サクラブレイド",     color: "#e91e63", jockey: "#ffeb3b" },
  { name: "カミナリオウ",       color: "#ffc107", jockey: "#1976d2" },
  { name: "ハヤテツバサ",       color: "#3f51b5", jockey: "#f44336" },
  { name: "アラシノコウテイ",   color: "#4caf50", jockey: "#ffffff" },
  { name: "ホシノカケラ",       color: "#9c27b0", jockey: "#ff9800" },
  { name: "ユキノセンプウ",     color: "#00bcd4", jockey: "#e91e63" },
  { name: "ダイヤモンドアロー", color: "#ff5722", jockey: "#222222" },
  { name: "ゴールデンルナ",     color: "#ffd54a", jockey: "#311b92" },
];

const STYLES = [
  { id: "nige", label: "逃げ",   curve: t => t < 0.3 ? 1.12 : (t < 0.7 ? 1.0 : 0.88) },
  { id: "senko", label: "先行",  curve: t => t < 0.5 ? 1.05 : (t < 0.85 ? 1.0 : 0.95) },
  { id: "sashi", label: "差し",  curve: t => t < 0.5 ? 0.94 : (t < 0.85 ? 1.05 : 1.12) },
  { id: "oikomi", label: "追込", curve: t => t < 0.7 ? 0.88 : 1.22 },
];

const WEATHERS = [
  { name: "☀️ 晴", muddy: 0 },
  { name: "⛅ 曇", muddy: 0.05 },
  { name: "🌧️ 雨", muddy: 0.15 },
  { name: "⛈️ 重", muddy: 0.25 },
];
const DISTANCES = [1200, 1400, 1600, 1800, 2000, 2400];

// ============ Utilities ============
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => "¥" + Math.round(n).toLocaleString("ja-JP");

function hexInt(hex) { return parseInt(hex.replace("#", ""), 16); }
function darkenInt(hex, f) {
  const n = hexInt(hex);
  const r = Math.floor(((n >> 16) & 255) * f);
  const g = Math.floor(((n >> 8) & 255) * f);
  const b = Math.floor((n & 255) * f);
  return (r << 16) | (g << 8) | b;
}

// ============ Audio (WebAudio simple beeps) ============
function audio() {
  if (!STATE.audioOn) return null;
  if (!STATE.audioCtx) STATE.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return STATE.audioCtx;
}
function beep(freq, dur = 0.12, type = "sine", vol = 0.15) {
  const ctx = audio(); if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function fanfare() {
  if (!STATE.audioOn) return;
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, "triangle", 0.18), i * 130));
}
let gallopAccum = 0;
function gallopTick() {
  if (!STATE.audioOn) return;
  beep(80 + Math.random() * 30, 0.05, "square", 0.04);
}

// ============ Horse creation ============
function makeHorses() {
  const pool = [...HORSE_POOL].sort(() => Math.random() - 0.5).slice(0, 6);
  return pool.map((p, i) => {
    const style = choice(STYLES);
    const speed = rand(0.80, 1.0);
    const stamina = rand(0.7, 1.0);
    const accel = rand(0.7, 1.0);
    const cond = rand(0.85, 1.05); // today's form
    return {
      idx: i,
      num: i + 1,
      name: p.name,
      color: p.color,
      jockey: p.jockey,
      style: style,
      speed, stamina, accel, cond,
      odds: 0,
      // race-time
      pos: 0,
      vel: 0,
      dispVel: 0,
      stam: 100,
      finished: false,
      finishTime: 0,
      gallopPhase: Math.random() * Math.PI * 2,
      mesh: null,
    };
  });
}

function computeOdds(horses) {
  const scores = horses.map(h => h.speed * 0.45 + h.stamina * 0.30 + h.accel * 0.15 + h.cond * 0.10);
  const total = scores.reduce((a, b) => a + b, 0);
  horses.forEach((h, i) => {
    const prob = scores[i] / total;
    h.odds = clamp(0.8 / prob, 1.2, 99.9);
    h.odds = Math.round(h.odds * 10) / 10;
  });
}

// =====================================================================
// ============================ 3D ENGINE ==============================
// =====================================================================
const cvs = document.getElementById("canvas");
const THREE_OK = (typeof THREE !== "undefined");

// World tuning
const LANE_W = 1.9;          // lateral spacing between horses (units)
const TRACK_HALF = () => (STATE.horses.length * LANE_W) / 2 + 1.4;
const laneZ = (idx) => (idx - (STATE.horses.length - 1) / 2) * LANE_W;

let scene, camera, renderer;
let sunLight, hemiLight;
let trackGroup, horseGroup;
let dustPool = [], dustTex;
let rain, rainData = null;
const camLook = THREE_OK ? new THREE.Vector3(20, 1.3, 0) : null;
const tmpV = THREE_OK ? new THREE.Vector3() : null;

function init3D() {
  renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xbfd2e0, 35, 240);

  camera = new THREE.PerspectiveCamera(52, 1, 0.1, 3000);
  camera.position.set(-10, 6, 16);

  hemiLight = new THREE.HemisphereLight(0xcfe3ff, 0x4a6a3a, 0.75);
  scene.add(hemiLight);

  sunLight = new THREE.DirectionalLight(0xfff2d5, 1.25);
  sunLight.position.set(40, 60, 30);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  const sc = sunLight.shadow.camera;
  sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45;
  sc.near = 1; sc.far = 200;
  sunLight.shadow.bias = -0.0004;
  scene.add(sunLight);
  scene.add(sunLight.target);

  // soft round sprite texture for dust
  dustTex = makeDustTexture();
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Sprite(new THREE.SpriteMaterial({
      map: dustTex, transparent: true, depthWrite: false, opacity: 0,
    }));
    m.visible = false;
    dustPool.push({ sprite: m, life: 0, vx: 0, vy: 0, vz: 0 });
    scene.add(m);
  }

  buildRain();
  resize3D();
  window.addEventListener("resize", resize3D);
}

function resize3D() {
  const r = cvs.getBoundingClientRect();
  if (r.width === 0 || r.height === 0) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}

// ---- procedural textures ----
function makeDustTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,0.9)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  return t;
}
function makeSkyTexture(topHex, botHex) {
  const c = document.createElement("canvas"); c.width = 8; c.height = 256;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, "#" + topHex.toString(16).padStart(6, "0"));
  g.addColorStop(0.55, "#" + botHex.toString(16).padStart(6, "0"));
  g.addColorStop(1, "#" + botHex.toString(16).padStart(6, "0"));
  x.fillStyle = g; x.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  return t;
}
function makeDirtTexture(baseHex) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d");
  x.fillStyle = "#" + baseHex.toString(16).padStart(6, "0");
  x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) {
    const a = Math.random() * 0.10;
    x.fillStyle = Math.random() < 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,235,200,${a})`;
    const s = Math.random() * 3 + 1;
    x.fillRect(Math.random() * 256, Math.random() * 256, s, s);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function makeCrowdTexture() {
  const c = document.createElement("canvas"); c.width = 256; c.height = 96;
  const x = c.getContext("2d");
  x.fillStyle = "#2a3340"; x.fillRect(0, 0, 256, 96);
  for (let row = 0; row < 7; row++) {
    for (let col = 0; col < 32; col++) {
      x.fillStyle = `hsl(${Math.floor(Math.random() * 360)},${50 + Math.random() * 30}%,${45 + Math.random() * 25}%)`;
      x.beginPath();
      x.arc(col * 8 + 4, row * 13 + 8, 3, 0, Math.PI * 2); x.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  return t;
}
function makeTextTexture(text, bgHex, fgHex) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  x.fillStyle = "#" + bgHex.toString(16).padStart(6, "0");
  x.fillRect(0, 0, 64, 64);
  x.fillStyle = "#" + fgHex.toString(16).padStart(6, "0");
  x.font = "bold 44px sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(String(text), 32, 36);
  return new THREE.CanvasTexture(c);
}
function makeBannerTexture(text) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const x = c.getContext("2d");
  x.fillStyle = "#d12f2f"; x.fillRect(0, 0, 256, 64);
  x.fillStyle = "#fff"; x.font = "bold 40px sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(text, 128, 34);
  return new THREE.CanvasTexture(c);
}

// ---- track / world ----
function clearGroup(g) {
  if (!g) return;
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
  scene.remove(g);
}

function buildTrack() {
  clearGroup(trackGroup);
  trackGroup = new THREE.Group();
  const len = STATE.raceDistance;          // world units along +X
  const half = TRACK_HALF();
  const w = WEATHER_LOOK[STATE.weather.name] || WEATHER_LOOK["☀️ 晴"];

  // infield grass (big ground)
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x386b34, roughness: 1 });
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(len + 600, 700), grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.position.set(len / 2, -0.02, 0);
  grass.receiveShadow = true;
  trackGroup.add(grass);

  // dirt track
  const dirtTex = makeDirtTexture(w.dirt);
  dirtTex.repeat.set((len + 80) / 6, half * 2 / 6);
  const trackMat = new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 });
  const track = new THREE.Mesh(new THREE.PlaneGeometry(len + 80, half * 2), trackMat);
  track.rotation.x = -Math.PI / 2;
  track.position.set(len / 2, 0.0, 0);
  track.receiveShadow = true;
  trackGroup.add(track);

  // rails (inner = +Z infield side, outer = -Z stand side)
  const railMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  [half + 0.1, -half - 0.1].forEach(z => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len + 80, 0.12, 0.12), railMat);
    rail.position.set(len / 2, 0.85, z);
    trackGroup.add(rail);
  });

  // start & finish stripe lines on track
  function stripeLine(xpos) {
    const grp = new THREE.Group();
    const n = 14;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(0.5, (half * 2) / n * 0.9),
        new THREE.MeshStandardMaterial({ color: i % 2 ? 0x111111 : 0xffffff, roughness: 0.6 })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.set(xpos, 0.03, -half + (i + 0.5) * (half * 2 / n));
      grp.add(m);
    }
    return grp;
  }
  trackGroup.add(stripeLine(0));
  trackGroup.add(stripeLine(len));

  // distance marker poles every 200m (trackside, infield)
  const poleMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  for (let m = 200; m < len; m += 200) {
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.6, 0.1), poleMat);
    pole.position.set(m, 0.8, half + 0.5);
    pole.castShadow = true;
    trackGroup.add(pole);
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.28, 0.06),
      new THREE.MeshBasicMaterial({ map: makeTextTexture(len - m, 0x222a33, 0xffd54a) }));
    top.position.set(m, 1.65, half + 0.55);
    trackGroup.add(top);
  }

  // ---- finish gantry (arch + GOAL banner) ----
  const gantry = new THREE.Group();
  const postMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.4 });
  [half + 0.6, -half - 0.6].forEach(z => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 7, 12), postMat);
    post.position.set(len, 3.5, z);
    post.castShadow = true;
    gantry.add(post);
  });
  const beam = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, half * 2 + 1.6), postMat);
  beam.position.set(len, 7, 0);
  gantry.add(beam);
  const banner = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, half * 2 + 1.6),
    new THREE.MeshBasicMaterial({ map: makeBannerTexture("G O A L") }));
  banner.position.set(len, 6.0, 0);
  gantry.add(banner);
  trackGroup.add(gantry);

  // ---- grandstand behind horses (-Z), facing +Z toward camera ----
  const standLen = len + 120;
  const crowdTex = makeCrowdTexture();
  crowdTex.repeat.set(standLen / 6, 1);
  const standMat = new THREE.MeshStandardMaterial({ map: crowdTex, roughness: 1 });
  const stand = new THREE.Mesh(new THREE.BoxGeometry(standLen, 16, 8), standMat);
  stand.position.set(len / 2, 8, -half - 9);
  stand.receiveShadow = true;
  trackGroup.add(stand);
  // roof
  const roof = new THREE.Mesh(new THREE.BoxGeometry(standLen, 0.6, 11),
    new THREE.MeshStandardMaterial({ color: 0x2b3440, roughness: 0.8 }));
  roof.position.set(len / 2, 16.4, -half - 10.5);
  roof.rotation.x = 0.12;
  trackGroup.add(roof);
  // red trim
  const trim = new THREE.Mesh(new THREE.BoxGeometry(standLen, 0.7, 0.3),
    new THREE.MeshStandardMaterial({ color: 0xd12f2f }));
  trim.position.set(len / 2, 15.6, -half - 5.1);
  trackGroup.add(trim);

  // start gate frame at x=0
  const gateMat = new THREE.MeshStandardMaterial({ color: 0x3a4555, roughness: 0.6 });
  const gateBeam = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, half * 2), gateMat);
  gateBeam.position.set(0, 2.4, 0);
  trackGroup.add(gateBeam);
  for (let i = 0; i <= STATE.horses.length; i++) {
    const z = -half + i * (half * 2 / STATE.horses.length);
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.4, 0.18), gateMat);
    p.position.set(0, 1.2, z);
    trackGroup.add(p);
  }

  scene.add(trackGroup);
}

// ---- horse model factory ----
function buildHorseMesh(h) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: hexInt(h.color), roughness: 0.55 });
  const darkMat = new THREE.MeshStandardMaterial({ color: darkenInt(h.color, 0.6), roughness: 0.6 });
  const legMat  = new THREE.MeshStandardMaterial({ color: darkenInt(h.color, 0.72), roughness: 0.7 });
  const hoofMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });

  // body (forward = +X)
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 14), bodyMat);
  body.scale.set(1.35, 0.66, 0.62);
  body.position.y = 1.15;
  body.castShadow = true;
  g.add(body);
  // chest bulk
  const chest = new THREE.Mesh(new THREE.SphereGeometry(0.62, 14, 12), bodyMat);
  chest.position.set(1.0, 1.2, 0); chest.castShadow = true;
  g.add(chest);
  const rump = new THREE.Mesh(new THREE.SphereGeometry(0.62, 14, 12), bodyMat);
  rump.position.set(-1.05, 1.2, 0); rump.castShadow = true;
  g.add(rump);

  // neck pivot at shoulder
  const neckPivot = new THREE.Group();
  neckPivot.position.set(1.15, 1.45, 0);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.36, 1.05, 12), bodyMat);
  neck.position.set(0.32, 0.35, 0);
  neck.rotation.z = -0.9;
  neck.castShadow = true;
  neckPivot.add(neck);
  // mane
  const mane = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.16, 0.1), darkMat);
  mane.position.set(0.3, 0.5, 0); mane.rotation.z = -0.9;
  neckPivot.add(mane);
  // head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.32, 0.3), bodyMat);
  head.position.set(0.72, 0.66, 0); head.rotation.z = -0.25; head.castShadow = true;
  neckPivot.add(head);
  const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.24), darkMat);
  muzzle.position.set(1.0, 0.52, 0);
  neckPivot.add(muzzle);
  // ears
  [-0.12, 0.12].forEach(zz => {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.18, 6), bodyMat);
    ear.position.set(0.6, 0.84, zz);
    neckPivot.add(ear);
  });
  g.add(neckPivot);

  // tail pivot
  const tailPivot = new THREE.Group();
  tailPivot.position.set(-1.35, 1.35, 0);
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.04, 0.95, 8), darkMat);
  tail.position.set(-0.1, -0.4, 0); tail.rotation.z = 0.5;
  tailPivot.add(tail);
  g.add(tailPivot);

  // legs: 4 hip pivots, each with knee pivot
  const legDefs = [
    { x: 0.85,  z: 0.34,  off: Math.PI * 1.0 },  // front-right
    { x: 0.85,  z: -0.34, off: Math.PI * 1.18 }, // front-left
    { x: -0.9,  z: 0.34,  off: Math.PI * 0.15 }, // back-right
    { x: -0.9,  z: -0.34, off: 0 },              // back-left
  ];
  const legs = [];
  legDefs.forEach(d => {
    const hip = new THREE.Group();
    hip.position.set(d.x, 1.0, d.z);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.1, 0.6, 8), legMat);
    upper.position.y = -0.3; upper.castShadow = true;
    hip.add(upper);
    const knee = new THREE.Group();
    knee.position.y = -0.6;
    const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.07, 0.6, 8), legMat);
    lower.position.y = -0.3; lower.castShadow = true;
    knee.add(lower);
    const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 0.18), hoofMat);
    hoof.position.y = -0.62;
    knee.add(hoof);
    hip.add(knee);
    g.add(hip);
    legs.push({ hip, knee, off: d.off });
  });

  // jockey pivot
  const jockeyPivot = new THREE.Group();
  jockeyPivot.position.set(0.05, 1.7, 0);
  const silkMat = new THREE.MeshStandardMaterial({ color: hexInt(h.jockey), roughness: 0.5 });
  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), silkMat);
  torso.scale.set(0.85, 1.0, 0.7);
  torso.castShadow = true;
  jockeyPivot.add(torso);
  // silk stripe
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.6), new THREE.MeshStandardMaterial({ color: darkenInt(h.jockey, 0.5) }));
  jockeyPivot.add(stripe);
  // helmet (horse color)
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), bodyMat);
  helmet.position.set(0.12, 0.42, 0); helmet.castShadow = true;
  jockeyPivot.add(helmet);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.34), hoofMat);
  visor.position.set(0.28, 0.4, 0);
  jockeyPivot.add(visor);
  // arms reaching to neck
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 6), silkMat);
  arm.position.set(0.45, 0.0, 0); arm.rotation.z = Math.PI / 2.3;
  jockeyPivot.add(arm);
  jockeyPivot.rotation.z = -0.28; // forward crouch
  g.add(jockeyPivot);

  // saddle cloth with number (both sides)
  const clothTex = makeTextTexture(h.num, hexInt(h.color), darkenInt(h.color, 0.25) > 0x888888 ? 0x111111 : 0xffffff);
  [0.63, -0.63].forEach((zz, i) => {
    const cloth = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.6),
      new THREE.MeshBasicMaterial({ map: clothTex, side: THREE.DoubleSide }));
    cloth.position.set(-0.2, 1.25, zz);
    cloth.rotation.y = i ? Math.PI : 0;
    g.add(cloth);
  });

  g.scale.setScalar(0.92);
  g.userData = { legs, neckPivot, tailPivot, jockeyPivot, body, baseY: 0 };
  return g;
}

function buildHorses() {
  clearGroup(horseGroup);
  horseGroup = new THREE.Group();
  STATE.horses.forEach(h => {
    const m = buildHorseMesh(h);
    m.position.set(0, 0, laneZ(h.idx));
    m.rotation.y = -Math.PI / 2; // face +X (since model forward is +X local, group default forward... we orient by yaw)
    // NOTE: model built facing +X already; keep yaw 0 so it travels +X.
    m.rotation.y = 0;
    h.mesh = m;
    horseGroup.add(m);
  });
  scene.add(horseGroup);
}

// ---- dust ----
function spawnDust(x, z) {
  const w = WEATHER_LOOK[STATE.weather.name] || WEATHER_LOOK["☀️ 晴"];
  const col = new THREE.Color(w.dirt).lerp(new THREE.Color(0xffffff), 0.25);
  for (const d of dustPool) {
    if (d.life <= 0) {
      d.sprite.visible = true;
      d.sprite.position.set(x + rand(-0.2, 0.2), 0.15, z + rand(-0.2, 0.2));
      const s = rand(0.4, 0.9);
      d.sprite.scale.set(s, s, s);
      d.sprite.material.color.copy(col);
      d.life = 1;
      d.vx = rand(-2.5, -0.5);
      d.vy = rand(0.6, 1.8);
      d.vz = rand(-0.6, 0.6);
      return;
    }
  }
}
function updateDust(dt) {
  for (const d of dustPool) {
    if (d.life <= 0) continue;
    d.life -= dt * 1.3;
    if (d.life <= 0) { d.sprite.visible = false; continue; }
    d.sprite.position.x += d.vx * dt;
    d.sprite.position.y += d.vy * dt;
    d.sprite.position.z += d.vz * dt;
    d.vy -= 1.5 * dt;
    const s = d.sprite.scale.x + dt * 1.2;
    d.sprite.scale.set(s, s, s);
    d.sprite.material.opacity = clamp(d.life, 0, 1) * 0.6;
  }
}

// ---- rain ----
function buildRain() {
  const N = 600;
  const pos = new Float32Array(N * 6); // 2 verts per drop
  rainData = [];
  for (let i = 0; i < N; i++) {
    const x = rand(-28, 28), y = rand(0, 45), z = rand(-28, 28);
    const len = rand(0.5, 1.1);
    pos[i * 6] = x; pos[i * 6 + 1] = y; pos[i * 6 + 2] = z;
    pos[i * 6 + 3] = x + 0.05; pos[i * 6 + 4] = y - len; pos[i * 6 + 5] = z;
    rainData.push({ len });
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.LineBasicMaterial({ color: 0xbcd2e6, transparent: true, opacity: 0 });
  rain = new THREE.LineSegments(geo, mat);
  rain.frustumCulled = false;
  rain.visible = false;
  scene.add(rain);
}
function updateRain(dt) {
  if (!rain || !rain.visible) return;
  rain.position.set(Math.round(camera.position.x), 0, Math.round(camera.position.z));
  const arr = rain.geometry.attributes.position.array;
  const fall = 55 * dt;
  for (let i = 0; i < rainData.length; i++) {
    const yTop = i * 6 + 1, yBot = i * 6 + 4;
    arr[yTop] -= fall; arr[yBot] -= fall;
    if (arr[yTop] < 0) {
      const ny = rand(35, 46);
      arr[yTop] = ny; arr[yBot] = ny - rainData[i].len;
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;
}

// ---- per-frame horse + camera animation ----
function animateHorses(dt, time) {
  STATE.horses.forEach(h => {
    if (!h.mesh) return;
    const m = h.mesh, u = m.userData;
    // smoothed display velocity (so finished horses ease to a stop)
    const targetV = h.finished ? 0 : h.vel;
    h.dispVel = lerp(h.dispVel, targetV, dt * 3);
    const spd = h.dispVel;

    // advance gallop cycle by speed
    h.gallopPhase += (1.6 + spd * 0.75) * dt;
    const ph = h.gallopPhase;
    const intensity = clamp(spd / 12, 0, 1);
    const swing = 0.55 + 0.35 * intensity;

    // legs: swing about Z (fore/aft) + knee bend on recovery
    u.legs.forEach(L => {
      const a = ph + L.off;
      L.hip.rotation.z = Math.sin(a) * swing;
      L.knee.rotation.z = Math.max(0, Math.cos(a)) * (0.5 + 0.8 * intensity);
    });

    // body bob + pitch (gather/extend)
    const bob = Math.abs(Math.sin(ph)) * 0.12 * intensity;
    m.position.x = h.pos;
    m.position.y = bob;
    m.position.z = laneZ(h.idx);
    u.body.rotation.z = Math.sin(ph * 2) * 0.05 * intensity;

    // neck pump + tail stream
    u.neckPivot.rotation.z = Math.sin(ph) * 0.08 * intensity;
    u.tailPivot.rotation.z = 0.2 + Math.sin(time * 6 + h.idx) * 0.12 - intensity * 0.35;
    u.tailPivot.rotation.x = Math.sin(time * 7 + h.idx) * 0.1;

    // jockey pumping
    u.jockeyPivot.position.y = 1.7 + Math.abs(Math.sin(ph)) * 0.06 * intensity;
    u.jockeyPivot.rotation.z = -0.28 + Math.sin(ph) * 0.07 * intensity;

    // hoof dust
    if (spd > 4 && Math.random() < 0.5 * intensity) {
      spawnDust(h.pos - 0.6, laneZ(h.idx) + rand(-0.3, 0.3));
    }
  });
}

let camFov = 52;
function updateCamera(dt, time) {
  const len = STATE.raceDistance;
  const sorted = [...STATE.horses].sort((a, b) => b.pos - a.pos);
  const lead = sorted[0] || { pos: 0, vel: 0 };
  const lx = lead.pos;
  const progress = lx / len;

  let desPos = tmpV, desLook = new THREE.Vector3(), desFov = 52;

  if (!STATE.autoCam) {
    // free side-broadcast: lock to mid-pack from a wide side angle
    const mid = sorted[Math.floor(sorted.length / 2)] || lead;
    desPos.set(mid.pos - 2, 7, 22);
    desLook.set(mid.pos + 2, 1.4, 0);
    desFov = 46;
  } else if (!STATE.running) {
    // pre-race establishing: slow drift across the gate
    const sway = Math.sin(time * 0.25) * 6;
    desPos.set(-7 + sway, 5.5, 17);
    desLook.set(6, 1.4, 0);
    desFov = 54;
  } else if (progress > 0.84) {
    // finish drama: low camera near the goal, looking back at the charge
    desPos.set(len + 9, 1.9, 12);
    desLook.set(lx - 2.5, 1.3, 0);
    desFov = 60;
  } else if (progress < 0.12) {
    // explosive start: low 3/4 rear, horses bursting away
    desPos.set(lx - 8, 2.4, 12);
    desLook.set(lx + 5, 1.3, 0);
    desFov = 56;
  } else {
    // broadcast 3/4 rear chase
    desPos.set(lx - 11, 4.4, 11);
    desLook.set(lx + 5, 1.3, 0);
    desFov = 50;
  }

  // smooth follow
  const k = STATE.running ? 0.07 : 0.04;
  camera.position.lerp(desPos, k);
  camLook.lerp(desLook, 0.1);

  // speed-based handheld shake
  const shake = clamp(lead.vel / 14, 0, 1) * (STATE.running ? 0.08 : 0);
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.y += (Math.random() - 0.5) * shake;
  camera.lookAt(camLook);

  camFov = lerp(camFov, desFov, 0.05);
  if (Math.abs(camera.fov - camFov) > 0.01) {
    camera.fov = camFov;
    camera.updateProjectionMatrix();
  }

  // keep shadow frustum on the action
  sunLight.target.position.set(lx, 0, 0);
  sunLight.position.set(lx + 35, 60, 30);
}

// ============ Simulation ============
let elapsedSec = 0;

function tickSim(dt) {
  if (!STATE.running) return;
  elapsedSec += dt;
  const total = STATE.raceDistance;

  STATE.horses.forEach(h => {
    if (h.finished) return;
    const t = h.pos / total;
    const styleMul = h.style.curve(t);
    const weatherMul = 1 - STATE.weather.muddy * (1 - h.stamina * 0.5);
    const stamMul = 0.6 + 0.4 * (h.stam / 100);
    const target = 12 * h.speed * h.cond * styleMul * weatherMul * stamMul;
    h.vel = lerp(h.vel, target + rand(-0.6, 0.6), dt * 2 * h.accel);
    h.vel = Math.max(0, h.vel);
    h.pos += h.vel * dt * 10;
    h.stam -= dt * (3 + (h.vel - 9) * 1.2) * (1 / h.stamina);
    h.stam = clamp(h.stam, 0, 100);
    if (h.pos >= total) {
      h.pos = total;
      h.finished = true;
      h.finishTime = elapsedSec;
    }
  });

  // Gallop sound
  gallopAccum += dt;
  if (gallopAccum > 0.12) { gallopAccum = 0; gallopTick(); }

  if (STATE.horses.every(h => h.finished)) finishRace();
}

// ============ Commentary ============
const COMM = {
  start: ["スタートしました！", "一斉にゲートが開いた！", "号砲！全馬好スタート！"],
  early: ["{lead} が先頭！", "{lead} がハナを取る！", "{lead} が好位！"],
  mid: ["勝負どころは第4コーナー！", "中団から {pos2} が押し上げる！", "{lead} まだ余裕の手応え！", "後方から {tail} 大外を回す！"],
  late: ["残り {rem}m！", "{lead} と {pos2} の競り合い！", "ムチが入った！", "ここから一気の追い込み！"],
  finish: ["ゴール！", "鼻差の勝負！", "歴史的な瞬間！"],
};
const commEl = document.getElementById("commentary");
let lastCommentary = 0;
function pickComment() {
  if (!STATE.running) return;
  if (elapsedSec - lastCommentary < 3) return;
  lastCommentary = elapsedSec;
  const sorted = [...STATE.horses].sort((a, b) => b.pos - a.pos);
  const lead = sorted[0];
  const t = lead.pos / STATE.raceDistance;
  let pool;
  if (elapsedSec < 1.5) pool = COMM.start;
  else if (t < 0.4) pool = COMM.early;
  else if (t < 0.75) pool = COMM.mid;
  else pool = COMM.late;
  let text = choice(pool);
  text = text.replace("{lead}", lead.name)
             .replace("{pos2}", (sorted[1] || lead).name)
             .replace("{tail}", sorted[sorted.length - 1].name)
             .replace("{rem}", Math.max(0, Math.round(STATE.raceDistance - lead.pos)));
  commEl.textContent = "📢 " + text;
  commEl.classList.add("show"); commEl.classList.remove("hide");
}

// ============ UI ============
function renderHud() {
  document.getElementById("raceNum").textContent = STATE.raceNum;
  document.getElementById("distance").textContent = STATE.raceDistance + "m";
  document.getElementById("weather").textContent = STATE.weather.name;
  document.getElementById("money").textContent = fmt(STATE.money);
}

function renderHorseList() {
  const wrap = document.getElementById("horseList");
  wrap.innerHTML = "";
  STATE.horses.forEach((h, i) => {
    const card = document.createElement("div");
    card.className = "horse-card" + (STATE.selectedHorse === i ? " selected" : "");
    card.dataset.idx = i;
    card.innerHTML = `
      <div class="hc-top">
        <div>
          <span class="num" style="background:${h.color}">${h.num}</span>
          <span class="name">${h.name}</span>
          <span class="style">[${h.style.label}]</span>
        </div>
        <div class="odds">${h.odds.toFixed(1)}</div>
      </div>
      <div class="stat-bar"><span class="stat-label">速度</span><div class="bar"><div class="fill" style="width:${(h.speed*100).toFixed(0)}%"></div></div></div>
      <div class="stat-bar"><span class="stat-label">持久</span><div class="bar"><div class="fill" style="width:${(h.stamina*100).toFixed(0)}%"></div></div></div>
      <div class="stat-bar"><span class="stat-label">瞬発</span><div class="bar"><div class="fill" style="width:${(h.accel*100).toFixed(0)}%"></div></div></div>
      <div class="stat-bar"><span class="stat-label">調子</span><div class="bar"><div class="fill" style="width:${clamp(h.cond * 90, 30, 100).toFixed(0)}%"></div></div></div>
    `;
    card.addEventListener("click", () => {
      if (STATE.running) return;
      STATE.selectedHorse = i;
      renderHorseList();
      beep(660, 0.06);
    });
    wrap.appendChild(card);
  });
}

function renderPositions() {
  const sorted = [...STATE.horses].sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.pos - a.pos;
  });
  const rows = document.getElementById("posRows");
  rows.innerHTML = sorted.map((h, i) => `
    <div class="row">
      <span style="color:var(--muted);width:18px">${i+1}</span>
      <span class="pos-num" style="background:${h.color}">${h.num}</span>
      <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h.name}</span>
    </div>
  `).join("");
}

function showCountdown(text) {
  const el = document.getElementById("countdown");
  el.textContent = text;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 600);
}

// ============ Race flow ============
function newRace() {
  STATE.horses = makeHorses();
  computeOdds(STATE.horses);
  STATE.selectedHorse = null;
  STATE.raceDistance = choice(DISTANCES);
  STATE.weather = choice(WEATHERS);
  elapsedSec = 0;
  STATE.running = false;
  if (THREE_OK) {
    applyWeather();
    buildTrack();
    buildHorses();
    // snap camera to establishing position
    camera.position.set(-7, 5.5, 17);
    camLook.set(6, 1.4, 0);
  }
  renderHud();
  renderHorseList();
  renderPositions();
  commEl.textContent = "出走馬を選んで賭けてください。";
  commEl.classList.add("show");
}

async function startRace() {
  if (STATE.selectedHorse == null) {
    commEl.textContent = "⚠️ 馬を選んでください";
    return;
  }
  const bet = parseInt(document.getElementById("betAmount").value) || 0;
  if (bet < 100) { commEl.textContent = "⚠️ 賭け金は¥100以上"; return; }
  if (bet > STATE.money) { commEl.textContent = "⚠️ 所持金が足りません"; return; }
  STATE.betAmount = bet;
  STATE.money -= bet;
  renderHud();
  document.getElementById("startBtn").disabled = true;

  if (STATE.audioCtx && STATE.audioCtx.state === "suspended") STATE.audioCtx.resume();

  for (let n = 3; n >= 1; n--) {
    showCountdown(String(n));
    beep(440 + (3 - n) * 80, 0.2, "triangle", 0.25);
    await sleep(700);
  }
  showCountdown("GO!");
  beep(880, 0.4, "square", 0.3);
  STATE.running = true;
  elapsedSec = 0;
  lastCommentary = -10;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function finishRace() {
  STATE.running = false;
  const sorted = [...STATE.horses].sort((a, b) => a.finishTime - b.finishTime);
  const winnerIdx = sorted[0].idx;
  const won = winnerIdx === STATE.selectedHorse;
  const payout = won ? Math.round(STATE.betAmount * STATE.horses[STATE.selectedHorse].odds) : 0;
  STATE.money += payout;
  fanfare();
  renderHud();
  // small delay so the finish camera lands before the modal
  setTimeout(() => showResult(sorted, won, payout), 1400);
}

function showResult(sorted, won, payout) {
  const modal = document.getElementById("resultModal");
  const podium = document.getElementById("podium");
  const payBox = document.getElementById("payoutBox");
  document.getElementById("resultTitle").textContent = won ? "🎉 的中！ 🎉" : "🏁 RESULT 🏁";
  podium.innerHTML = sorted.map((h, i) => {
    const cls = ["gold","silver","bronze"][i] || "";
    const medal = ["🥇","🥈","🥉","4","5","6","7","8"][i];
    return `<div class="row ${cls}">
      <div class="medal">${medal}</div>
      <span class="pos-num" style="background:${h.color}">${h.num}</span>
      <div class="nm">${h.name}</div>
      <div class="tm">${h.finishTime.toFixed(2)}s</div>
    </div>`;
  }).join("");
  if (won) {
    payBox.innerHTML = `
      <div class="big win">+${fmt(payout - STATE.betAmount)}</div>
      <div class="sm">${fmt(STATE.betAmount)} × ${STATE.horses[STATE.selectedHorse].odds.toFixed(1)} = ${fmt(payout)}</div>`;
  } else {
    payBox.innerHTML = `
      <div class="big lose">-${fmt(STATE.betAmount)}</div>
      <div class="sm">またのチャレンジを！</div>`;
  }
  modal.classList.add("show");
}

document.getElementById("nextRaceBtn").addEventListener("click", () => {
  document.getElementById("resultModal").classList.remove("show");
  STATE.raceNum += 1;
  if (STATE.money < 100) STATE.money = 10000; // safety reset
  newRace();
  document.getElementById("startBtn").disabled = false;
});

document.getElementById("startBtn").addEventListener("click", startRace);

document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    const inp = document.getElementById("betAmount");
    inp.value = Math.max(100, (parseInt(inp.value) || 0) + parseInt(c.dataset.amt));
    beep(880, 0.04);
  });
});

document.getElementById("muteBtn").addEventListener("click", (e) => {
  STATE.audioOn = !STATE.audioOn;
  e.target.textContent = STATE.audioOn ? "🔊 音 ON" : "🔇 音 OFF";
});

document.getElementById("camBtn").addEventListener("click", (e) => {
  STATE.autoCam = !STATE.autoCam;
  e.target.textContent = STATE.autoCam ? "🎥 自動" : "🎥 横";
  beep(540, 0.05);
});

// ============ Main loop ============
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const time = now / 1000;

  tickSim(dt);
  pickComment();
  if (STATE.running) renderPositions();

  animateHorses(dt, time);
  updateDust(dt);
  updateRain(dt);
  updateCamera(dt, time);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ============ Boot ============
function boot() {
  if (!THREE_OK) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("errbox").style.display = "flex";
    // Still set up the betting UI so the page isn't dead
    STATE.horses = makeHorses();
    computeOdds(STATE.horses);
    STATE.raceDistance = choice(DISTANCES);
    STATE.weather = choice(WEATHERS);
    renderHud(); renderHorseList(); renderPositions();
    return;
  }
  init3D();
  newRace();
  document.getElementById("loading").style.display = "none";
  requestAnimationFrame(loop);
}
boot();

</script>
